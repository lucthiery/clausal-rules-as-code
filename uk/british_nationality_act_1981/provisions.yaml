  id: ukpga-1981-61#section-50-1
  state: GREEN
  text: (1) In this Act, unless the context otherwise requires— “the 1948 Act ” means
    the British Nationality Act 1948 ; “alien ” means a person who is neither a Commonwealth
    citizen nor a British protected person nor a citizen of the Republic of Ireland
    ; “association ” means an unincorporated body of persons ; “British protected
    person ” means a person who is a member of any class of persons declared to be
    British protected persons by an Order in Council for the time being in force under
    section 38 or is a British protected person by virtue of the Solomon Islands Act
    1978; “commencement”, without more, means the commencement of this Act; “Commonwealth
    citizen” means a person who has the status of a Commonwealth citizen under this
    Act; “company ” means a body corporate ; •“Crown service ” means the service of
    the Crown, whether within Her Majesty's dominions or elsewhere; “Crown service
    under the government of the United Kingdom ” means Crown service under Her Majesty's
    government in the United Kingdom or under Her Majesty's government in Northern
    Ireland ; “dependent territory” means a territory mentioned in Schedule 6; “enactment
    ” includes an enactment comprised in Northern Ireland legislation; “foreign country
    ” means a country other than the United Kingdom, a dependent territory, a country
    mentioned in Schedule 3 and the Republic of Ireland ; “the former nationality
    Acts ” means— (a) the British Nationality Acts 1948 to 1965 ; (b) the British
    Nationality and Status of Aliens Acts 1914 to 1943 ; and (c) any Act repealed
    by the said Acts of 1914 to 1943 or by the Naturalization Act 1870 ; “Governor
    ”, in relation to a dependent territory, includes the officer for the time being
    administering the government of that territory; “High Commissioner ” includes
    an acting High Commissioner ; “immigration laws ”— (a) in relation to the United
    Kingdom, means the Immigration Act 1971 and any law for purposes similar to that
    Act which is for the time being or has at any time been in force in any part of
    the United Kingdom; (b) in relation to a dependent territory, means any law for
    purposes similar to the Immigration Act 1971 which is for the time being or has
    at any time been in force in that territory ; “the Islands” means the Channel
    Islands and the Isle of Man; “minor ” means a person who has not attained the
    age of eighteen years; “prescribed ” means prescribed by regulations made under
    section 41 ; “settled ” shall be construed in accordance with subsections (2)
    to (4); “ship ” includes a hovercraft; “statutory provision ” means any enactment
    or any provision contained in— (a) subordinate legislation (as defined in section
    21(1) of the Interpretation Act 1978); or (b) any instrument of a legislative
    character made under any Northern Ireland legislation; “the United Kingdom” means
    Great Britain, Northern Ireland and the Islands, taken together; “United Kingdom
    consulate ” means the office of a consular officer of Her Majesty's government
    in the United Kingdom where a register of births is kept or, where there is no
    such office, such office as may be prescribed.
