  - ukpga-1981-61#section-50-7-a-ii
  - ukpga-1981-61#section-50-7-b
  - ukpga-1981-61#section-50-8
  reason: 's. 50(6) (who was naturalised in the UK under the former Acts), s. 50(7) (births on ships and
    aircraft), s. 50(8) (an application is made when received), s. 50(12) (Schedule 3 countries include
    their dependencies) and s. 50(13) (amending Schedule 6) are not formalised: the caller supplies place_of_birth
    after applying s. 50(7), and the date of an application as the date of its receipt.'
  consequence: A birth on a ship or aircraft must be stated as in or outside the United Kingdom as s.
    50(7) deems it; an application date that is not the date of receipt can move a residence period.
