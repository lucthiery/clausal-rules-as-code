# Profile keys of uk/british_nationality_act_1981, the contract input_check.clausal folds over
# (person_contract/2 there is this list, in this order). A profile is a dict; mother, father,
# spouse and each adopter are profiles of the same shape. Types are descriptive; a date is
# date(Year, Month, Day); a period is period(From, To) with To a date or `ongoing`, both ends
# included (s. 50(10)(a)). Keys are bare atoms read with get(PROFILE, KEY, VALUE).
keys:
  date_of_birth: date                                   # required
  place_of_birth: atom                                  # required: united_kingdom | outside_united_kingdom (after s. 50(7))
  mother: profile                                       # optional: absent = not known
  father: profile                                       # optional: absent = not known
  born_legitimate: bool                                 # optional, default true (s. 50(9)(b))
  legitimated_on: date_or_none                          # optional, default none (s. 47(1))
  born_stateless: bool                                  # optional, default false (s. 3(2))
  found_abandoned_in_united_kingdom_on: date_or_none    # optional, default none (s. 1(2))
  contrary_shown_for_abandoned_infant: bool             # optional, default false (s. 1(2))
  citizenship_at_commencement: atom                     # optional, default none: none | otherwise_than_by_descent | by_descent | would_have_become_but_for_death(Mode)
  registrations: list(registration)                     # optional, default []: registration(Provision, Date)
  naturalisations: list(naturalisation)                 # optional, default []: naturalisation(Provision, Date)
  adoption_orders: list(adoption_order)                 # optional, default []: adoption_order(Date, Court, [Adopter, ...])
  date_of_death: date_or_none                           # optional, default none (s. 3(6))
  service_outside_united_kingdom: list(service)         # optional, default []: service(Kind, From, To, RecruitedIn)
  ordinarily_resident_in_united_kingdom: list(period)   # optional, default [] (s. 50(2))
  immigration_restrictions_on_stay: list(period)        # optional, default [] (s. 50(2), s. 4(2)(c), Sch 1)
  immigration_exemptions: list(exemption)               # optional, default []: exemption(Kind, From, To) (s. 50(3)-(4), Sch 1 para 9(1)(a))
  in_united_kingdom_in_breach_of_immigration_laws: list(period)  # optional, default [] (s. 50(5), s. 4(2)(d), Sch 1)
  diplomatic_immunity: list(period)                     # optional, default [] (s. 50(4))
  absences_from_united_kingdom: list(period)            # optional, default []: whole days absent, periods not overlapping (s. 50(10)(b))
  detentions: list(period)                              # optional, default [] (Sch 1 para 9(1)(b)-(d))
  parents_marriage_terminated_on: date_or_none          # optional, default none (s. 3(6)(a))
  parents_legally_separated_on: date_or_none            # optional, default none (s. 3(6)(a))
  consent_to_registration_signified_by: list(atom)      # optional, default []: mother | father (s. 3(5)(c))
  british_nationality_other_than_citizenship: atom      # optional, default none (s. 4(1))
  crown_service_in_dependent_territory: bool            # optional, default false (s. 4(5)-(6))
  of_unsound_mind: bool                                 # optional, default false (s. 50(11)(a))
  spouse: profile_or_none                               # optional, default none (s. 6(2))
  good_character: bool                                  # required for naturalisation (Sch 1 para 1(1)(b), 3(e))
  sufficient_knowledge_of_language: bool                # required for naturalisation (Sch 1 para 1(1)(c))
  intention_after_naturalisation: atom                  # required for naturalisation: principal_home_in_united_kingdom | qualifying_service | other
