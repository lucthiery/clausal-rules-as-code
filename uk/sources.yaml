jurisdiction: uk
name: United Kingdom
legal_system: common_law
languages: [en]
status: researched
researched: 2026-06-27
sources:
  - name: legislation.gov.uk
    url: https://www.legislation.gov.uk/
    type: consolidated_legislation
    official: true
    authority: The National Archives, on behalf of His Majesty's Government
    formats: [html, pdf, xml, akoma_ntoso, api]
    access: free
    licensing: Open Government Licence v3.0; EU-derived content under Commission Decision 2011/833/EU
    coverage: >
      Authoritative publication of UK primary and secondary legislation: Acts of Parliament,
      Statutory Instruments, Orders in Council, and devolved legislation (Scotland, Wales,
      Northern Ireland). Provides both as-enacted originals and as-amended consolidated
      ("revised") versions where available. Text in Crown Legislation Markup Language
      (CLML) XML; also served as Akoma Ntoso XML, RDF/XML, XHTML, and PDF. Acts available
      from 1267; SIs from 1948; continuous digital coverage from c. 1991. Note: not all
      amendments have been incorporated into revised text.
    update_cadence: continuous
    verified: 2026-06-27
    candidate_domains:
      - area: financial-services-authorisation
        shape: eligibility
        note: >
          Financial Services and Markets Act 2000 Sch 6 — threshold conditions for
          Part 4A permission are explicit pass/fail eligibility criteria
      - area: income-tax
        shape: numeric
        note: >
          Income Tax Act 2007 and annual Finance Acts — statutory rates, bands, and
          personal allowance thresholds are directly numeric
      - area: data-protection
        shape: deontic
        note: >
          UK GDPR and Data Protection Act 2018 — mandatory obligations, prohibitions,
          and conditional permissions with formal deontic structure
      - area: employment-status
        shape: classification
        note: >
          Employment Rights Act 1996 s.230 tripartite worker/employee/self-employed
          classification test; also Companies Act 2006 director definitions

  - name: legislation.gov.uk – Bulk Data and API
    url: https://legislation.github.io/data-documentation/api/overview.html
    type: bulk_data
    official: true
    authority: The National Archives
    formats: [xml, akoma_ntoso, api, bulk]
    access: free
    licensing: >
      Open Government Licence v3.0; rate limited to 3,000 API requests per 5 minutes
      per IP; bulk crawling and commercial reuse explicitly permitted
    coverage: >
      RESTful API and bulk-download service exposing the full legislation corpus in
      multiple structured formats. CLML XML and Akoma Ntoso XML accessible per document
      via /data.xml and /data.akn URI suffixes respectively. Atom feeds list newly enacted
      and amended legislation. Bulk downloads available for all UK legislation in CLML,
      AKN, XHTML, and PDF via S3 bucket. XSLT transformations (CLML→XHTML, CLML→AKN,
      AKN→HTML5) published on GitHub under OGL. Suitable for crawling, machine learning
      pipelines, and commercial reuse.
    update_cadence: continuous
    verified: 2026-06-27
    candidate_domains: []

  - name: The Gazette (London, Edinburgh, Belfast)
    url: https://www.thegazette.co.uk/
    type: gazette
    official: true
    authority: >
      TSO (The Stationery Office) under the superintendence of His Majesty's Stationery
      Office; published as the London Gazette (est. 1665), Edinburgh Gazette, and Belfast Gazette
    formats: [html, pdf, xml, json, api]
    access: free
    licensing: Open Government Licence v3.0 (excluding personal data)
    coverage: >
      The UK's official gazette of public record. Publishes statutory notices required by
      law: corporate insolvency (winding-up petitions and orders, administrations,
      receiverships), personal insolvency (bankruptcies, IVAs), company dissolutions and
      restorations, deceased-estate notices, state appointments, Royal proclamations,
      Honours lists, and Ministry of Defence promotions. Searchable back to 1665; notices
      from c. 2000 available in structured electronic form. Linked-data API with SPARQL
      endpoint; notices also available in JSON-LD, RDF/Turtle, and XML. Data service
      provides corporate and insolvency data feeds.
    update_cadence: daily
    verified: 2026-06-27
    candidate_domains:
      - area: corporate-insolvency
        shape: temporal
        note: >
          Winding-up and administration notices carry statutory effective dates and creditor
          deadlines under the Insolvency Act 1986 — highly temporal structure
      - area: personal-insolvency
        shape: eligibility
        note: >
          Bankruptcy order and discharge notices trigger eligibility changes; annulment
          notices reverse them — eligibility conditions under IA 1986 Parts VIII–XI

  - name: Find Case Law – The National Archives
    url: https://caselaw.nationalarchives.gov.uk/
    type: case_law
    official: true
    authority: The National Archives, in partnership with the Ministry of Justice
    formats: [html, xml, pdf, api]
    access: free
    licensing: >
      Open Justice Licence — permits copying, distribution, and commercial reuse;
      bulk computational analysis requires a separate (free) application to The National Archives
    coverage: >
      Official repository of judgments and decisions from courts and tribunals in England
      and Wales, plus UK-wide judgments from the Supreme Court and Privy Council. Coverage
      for most courts from the early 2000s; Supreme Court from 2009. Judgments published
      in Akoma Ntoso (LegalDocML) XML. Public API provides Atom feeds and per-document
      XML retrieval (rate limit: 1,000 requests per 5-minute window per IP). Does not
      include most lower-court oral decisions.
    update_cadence: continuous
    verified: 2026-06-27
    candidate_domains:
      - area: financial-services
        shape: classification
        note: >
          Court and tribunal interpretation of FSMA 2000 terms (e.g. "investment",
          "arranging", "specified activity") informs classification of regulated activities
      - area: competition
        shape: constraint-satisfaction
        note: >
          CAT and Court of Appeal merger and cartel judgments operationalise the SLC
          (substantial lessening of competition) test — multi-factor constraint analysis

  - name: BAILII – British and Irish Legal Information Institute
    url: https://www.bailii.org/
    type: case_law
    official: false
    authority: British and Irish Legal Information Institute (charitable organisation, Institute of Advanced Legal Studies)
    formats: [html]
    access: free
    licensing: >
      Crown copyright reproduced under licence from originating courts; free for non-commercial
      use; bulk downloading, scraping, and automated access explicitly prohibited by Terms of Service
    coverage: >
      Free-access aggregator of 240,000+ UK and Irish court decisions plus EU and ECHR
      case law. Covers England and Wales, Scotland, Northern Ireland, Ireland, Privy Council,
      European Court of Justice, and ECtHR. Broader historical depth than Find Case Law:
      House of Lords from 1946, Court of Appeal from 1980, extensive tribunal coverage.
      Also includes legislation, Law Commission reports, and Privy Council case papers.
      Updated daily; no API; bulk automated access prohibited.
    update_cadence: daily
    verified: 2026-06-27
    candidate_domains:
      - area: contract-law
        shape: deontic
        note: >
          Common law formation, breach, and remedy decisions contain explicit
          permission/obligation structures that can be extracted for deontic modelling
      - area: judicial-review
        shape: eligibility
        note: >
          Standing tests and procedural eligibility criteria for judicial review articulated
          across thousands of Administrative Court decisions

  - name: FCA Handbook
    url: https://handbook.fca.org.uk/
    type: regulator
    official: true
    authority: Financial Conduct Authority (established under Financial Services and Markets Act 2000)
    formats: [html, pdf]
    access: free
    licensing: "Copyright © FCA. All rights reserved."
    coverage: >
      Complete consolidated rulebook of the Financial Conduct Authority for all authorised
      firms. Organised into High Level Standards (PRIN, SYSC, COND, APER, FIT), Prudential
      Standards (MIFIDPRU, INSPRU, IPRUINV), Business Standards (COBS, ICOBS, MCOB, BCOBS,
      CASS, MAR, ESG, PROD), Regulatory Processes, Redress sourcebooks (DISP, COMP), and
      Specialist Sourcebooks. Incorporates the full Glossary and all Legal Instruments with
      amending history. Covers financial services authorisation, conduct of business, market
      abuse, capital adequacy, insurance, consumer credit, and ESG disclosure.
    update_cadence: continuous
    verified: 2026-06-27
    candidate_domains:
      - area: financial-services-authorisation
        shape: eligibility
        note: >
          COND sourcebook — six threshold conditions for Part 4A permission under FSMA 2000
          are explicit pass/fail eligibility criteria formalizable as constraint satisfaction
      - area: conduct-of-business
        shape: deontic
        note: >
          COBS obligations (suitability assessment, fair treatment, best execution, disclosure)
          have strong mandatory/conditional deontic structure
      - area: capital-adequacy
        shape: numeric
        note: >
          MIFIDPRU own-funds thresholds, K-factor formulae (K-AUM, K-CMH, K-TCD), and
          fixed overheads requirement are directly numeric constraints

  - name: HMRC Tax Manuals
    url: https://www.gov.uk/government/collections/hmrc-manuals
    type: regulator
    official: true
    authority: HM Revenue and Customs
    formats: [html]
    access: free
    licensing: Open Government Licence v3.0
    coverage: >
      Over 100 technical guidance manuals covering all major UK taxes: income tax,
      corporation tax, capital gains tax, inheritance tax, VAT, stamp duty land tax,
      national insurance contributions, PAYE, customs duty, and excise duty. Also covers
      specialist sectors (banking, insurance, oil and gas, film and TV). Written as
      technical guidance for HMRC staff and tax professionals. Reflects HMRC's
      interpretation of the law; not a definitive legal statement but authoritative for
      compliance purposes. Includes the Compliance Handbook and Enquiry Manual.
    update_cadence: irregular
    verified: 2026-06-27
    candidate_domains:
      - area: income-tax
        shape: numeric
        note: >
          Income Tax Manual — statutory rates, bands, personal allowances, and allowable
          deduction limits are directly numeric and machine-readable
      - area: vat
        shape: classification
        note: >
          VAT manuals define whether supplies are standard-rated, reduced-rated, zero-rated,
          or exempt — a direct multi-class classification problem
      - area: employment-status
        shape: classification
        note: >
          Employment Status Manual operationalises the employed/self-employed distinction
          for tax purposes; aligns with but differs from employment-law classification

  - name: ICO – Information Commissioner's Office Guidance
    url: https://ico.org.uk/for-organisations/
    type: regulator
    official: true
    authority: Information Commissioner's Office (established under Data Protection Act 2018)
    formats: [html, pdf]
    access: free
    licensing: Open Government Licence v3.0
    coverage: >
      Comprehensive guidance for organisations on UK data protection law: UK GDPR, Data
      Protection Act 2018, and PECR (Privacy and Electronic Communications Regulations
      2003). Topics include lawful bases for processing, data subject rights, data breach
      notification (Article 33/34), data protection impact assessments, international
      data transfers, and cookies and tracking technologies. Incorporates guidance on the
      Data Use and Access Act 2025 including the new recognised legitimate interest basis.
      Guidance updated continuously as law evolves and new ICO decisions are issued.
    update_cadence: continuous
    verified: 2026-06-27
    candidate_domains:
      - area: data-protection-lawful-basis
        shape: eligibility
        note: >
          UK GDPR Article 6 — six lawful bases each with explicit preconditions;
          DUA Act 2025 adds recognised legitimate interests with its own eligibility test
      - area: data-breach-notification
        shape: eligibility
        note: >
          Article 33 — controller notification duty triggered when breach meets
          "likely to result in a risk to rights and freedoms" threshold criteria

  - name: CMA – Competition and Markets Authority Cases
    url: https://www.gov.uk/cma-cases
    type: regulator
    official: true
    authority: Competition and Markets Authority (established under Enterprise and Regulatory Reform Act 2013)
    formats: [html, pdf]
    access: free
    licensing: Open Government Licence v3.0
    coverage: >
      Public register of 2,500+ CMA cases: merger decisions (Phase 1 and Phase 2),
      CA98 competition enforcement (cartels, abuse of dominance), consumer enforcement,
      market studies and investigations, criminal cartel prosecutions, Digital Markets
      Unit investigations under the Digital Markets, Competition and Consumers Act 2024,
      and Subsidy Advice Unit referrals. Filterable by case type, status, market sector,
      and outcome. Atom feed available at /cma-cases.atom for new case notifications.
    update_cadence: continuous
    verified: 2026-06-27
    candidate_domains:
      - area: merger-control
        shape: constraint-satisfaction
        note: >
          SLC (substantial lessening of competition) test under Enterprise Act 2002 s.35
          — multi-factor constraint: market share, concentration, barriers to entry,
          counterfactual, and efficiencies
      - area: competition-enforcement
        shape: eligibility
        note: >
          CA98 Chapter I and II prohibitions — agreement or conduct must satisfy
          dominance/effect-on-trade threshold conditions to trigger prohibition
      - area: digital-markets
        shape: classification
        note: >
          DMCCA 2024 — Strategic Market Status designation requires classification
          of firm's market position and conduct across defined digital activities
